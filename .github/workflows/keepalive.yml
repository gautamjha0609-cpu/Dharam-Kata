# Keeps the Supabase project awake. Free-tier projects are paused after about a week without activity.
# Add two repository secrets: SUPABASE_URL (https://<ref>.supabase.co) and SUPABASE_PUBLISHABLE_KEY.
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database API
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" -o /dev/null
