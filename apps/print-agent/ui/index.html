<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Dharam Kata Print Agent</title>
<style>
  *{box-sizing:border-box} body{margin:0;font:14px system-ui,Segoe UI,sans-serif;background:#f4f7fa;color:#12263a}
  header{background:#fff;border-bottom:3px solid #0B2D4C;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:6px;flex:none} .brand img{height:40px;width:auto} .brand span{display:flex;flex-direction:column;font-weight:800;font-size:13px;line-height:1.05;color:#1c2a3a} .brand .v{color:#1f5ea8}
  .app{flex:1;text-align:right;min-width:0} .app h1{margin:0;font-size:15px;color:#0B2D4C} .app p{margin:1px 0 0;font-size:11px;color:#51657a} .app a{color:#1f5ea8;font-size:12px}
  main{padding:14px;display:grid;gap:12px} .card{background:#fff;border:1px solid #dbe3ea;border-radius:10px;padding:14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap} .title{font-weight:700;color:#0B2D4C}
  label{display:block;font-weight:600;margin:10px 0 4px} input,select{width:100%;min-height:38px;padding:0 10px;border:1px solid #b9c5d1;border-radius:8px;font-size:14px}
  button{min-height:36px;padding:0 14px;border:0;border-radius:8px;background:#19B957;color:#fff;font-weight:600;cursor:pointer} button:disabled{opacity:.6;cursor:default}
  button.ghost{background:#fff;color:#0B2D4C;border:1px solid #b9c5d1} button.danger{background:#fff;color:#b42318;border:1px solid #f1b0aa}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #19B957;outline-offset:2px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700} .ok{background:#dcf5e5;color:#116b34} .bad{background:#fde4e1;color:#9c2118} .mid{background:#fff6e0;color:#8a5a00}
  .pick{display:flex;align-items:center;gap:8px;font-weight:400;margin:6px 0 0;padding:9px 10px;border:1px solid #dbe3ea;border-radius:8px;cursor:pointer} .pick input{width:auto;min-height:0}
  .printer{font-size:16px;font-weight:700;margin-top:6px} .kg{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:#0B2D4C}
  .err{color:#9c2118;margin-top:8px} .okt{color:#116b34;margin-top:8px} .muted{color:#51657a;font-size:12px;margin-top:6px;word-break:break-all}
  details summary{cursor:pointer;margin-top:10px;color:#51657a;font-size:12px} input[type=checkbox]{width:auto;min-height:0}
  .warn{background:#fff6e0;border-color:#f0c66b}
  @media (prefers-reduced-motion:no-preference){main>*{animation:in .15s ease-out} @keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header>
  <div class="brand" role="img" aria-label="The Valuation House"><img src="logo.png" alt=""><span aria-hidden="true"><b>The</b><b class="v">Valuation</b><b>House</b></span></div>
  <div class="app"><h1>Dharam Kata Print Agent</h1><p><span id="ver"></span> · <a href="#" id="site" title="Open the website">Website ↗</a></p></div>
</header>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pick = '';
let last = '';
let scaleEdit = null; // scale settings being edited (null = not editing)

// ---- weighing scale ----
const fmtKg = (kg) => Number(kg).toLocaleString('en-IN') + ' kg';
const LIVE = { stable: ['ok', 'Steady'], moving: ['mid', 'Moving'], no_data: ['bad', 'No data'], stale: ['bad', 'No data'], overload: ['bad', 'Overload'], bad_unit: ['bad', 'Wrong unit'] };
function liveHtml(sc) {
  const l = sc.live;
  if (!l) return '';
  const [cls, label] = LIVE[l.kind] || ['bad', l.kind];
  return `<div class="row" style="justify-content:flex-start;margin-top:8px"><span class="kg">${l.kg === null || l.kg === undefined ? '—' : esc(fmtKg(l.kg))}</span><span class="badge ${cls}">${label}</span></div>`;
}
function updateLive(s) { const el = $('#scaleLive'); if (el && s.scale) el.innerHTML = liveHtml(s.scale); }
function scaleCard(s) {
  const sc = s.scale;
  if (!sc) return '';
  const c = sc.cfg, st = sc.status;
  if (!scaleEdit) {
    if (!c.enabled) return `<div class="card"><div class="row"><span class="title">Weighing scale</span><button class="ghost" id="scSetup">Set up</button></div></div>`;
    const on = st && st.link === 'open';
    const where = c.source === 'tcp' ? `${esc(c.host)}:${esc(c.tcpPort)}` : c.source === 'sim' ? 'Simulator' : esc(c.port);
    return `<div class="card"><div class="row"><span class="title">Weighing scale · ${where}</span><span class="badge ${on ? 'ok' : 'bad'}">${on ? 'Connected' : st && st.link === 'connecting' ? 'Connecting…' : 'Not connected'}</span></div>
      ${st && st.error ? `<p class="err">${esc(st.error.message)}</p>` : ''}
      <div id="scaleLive">${liveHtml(sc)}</div>
      <div class="btns"><button id="scTest">Read weight</button><button class="ghost" id="scEdit">Settings</button></div>
      ${sc.test ? `<p class="${sc.test.ok ? 'okt' : 'err'}">${esc(sc.test.text)}</p>` : ''}</div>`;
  }
  const e = scaleEdit;
  const ports = sc.ports.map(p => `<option value="${esc(p.name)}" ${p.name === e.port ? 'selected' : ''}>${esc(p.label)}${p.usb ? ' · USB' : ''}</option>`).join('');
  const det = sc.detect;
  const unit = `<label for="scUnit">Unit</label><select id="scUnit"><option value="kg" ${e.unit !== 't' ? 'selected' : ''}>kg</option><option value="t" ${e.unit === 't' ? 'selected' : ''}>tonne</option></select>`;
  return `<div class="card"><span class="title">Weighing scale · settings</span>
    <label class="pick"><input type="radio" name="scsrc" value="serial" ${e.source === 'serial' ? 'checked' : ''}> COM port (cable / USB adapter)</label>
    <label class="pick"><input type="radio" name="scsrc" value="tcp" ${e.source === 'tcp' ? 'checked' : ''}> Network (IP address)</label>
    ${sc.sim ? `<label class="pick"><input type="radio" name="scsrc" value="sim" ${e.source === 'sim' ? 'checked' : ''}> Simulator</label>` : ''}
    ${e.source === 'serial' ? `
      <label for="scPort">COM port</label>
      ${ports ? `<select id="scPort"><option value="">Choose…</option>${ports}</select>` : `<p class="err">No COM port found.</p>`}
      ${unit}
      <div class="btns"><button id="scDetect" ${det.running ? 'disabled' : ''}>${det.running ? 'Searching…' : 'Find automatically'}</button><button class="ghost" id="scRefresh">Refresh ports</button></div>
      ${det.running ? `<p class="muted">${esc(det.text)}</p>` : ''}
      ${det.result ? `<p class="${det.result.ok ? 'okt' : 'err'}">${esc(det.result.message)}</p>` : ''}
      <details ${e.manual ? 'open' : ''} id="scAdv"><summary>Manual settings</summary>
        <label class="pick"><input type="checkbox" id="scAsk" ${e.ask ? 'checked' : ''}> Ask the indicator for the weight</label>
        <label for="scBaud">Baud</label><select id="scBaud">${[1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200].map(b => `<option ${Number(e.baud) === b ? 'selected' : ''}>${b}</option>`).join('')}</select>
        <label for="scFraming">Format</label><select id="scFraming">
          <option value="8N1" ${!e.mask7 && e.framing === '8N1' ? 'selected' : ''}>8 N 1</option>
          <option value="7E1" ${e.mask7 ? 'selected' : ''}>7 E 1 / 7 O 1</option>
          <option value="8E1" ${e.framing === '8E1' ? 'selected' : ''}>8 E 1</option>
          <option value="8O1" ${e.framing === '8O1' ? 'selected' : ''}>8 O 1</option></select>
        ${protoSelect(sc, e)}</details>` : ''}
    ${e.source === 'tcp' ? `
      <label for="scHost">IP address</label><input id="scHost" value="${esc(e.host || '')}" placeholder="192.168.1.50">
      <label for="scTcp">Port</label><input id="scTcp" inputmode="numeric" value="${esc(e.tcpPort || '')}" placeholder="4001">
      ${unit}${protoSelect(sc, e)}` : ''}
    <div id="scErr" class="err"></div>
    <div class="btns"><button id="scSave">Save</button><button class="ghost" id="scCancel">Cancel</button>${c.enabled ? '<button class="danger" id="scOff">Turn off</button>' : ''}</div></div>`;
}
const protoSelect = (sc, e) => `<label for="scProto">Indicator</label><select id="scProto"><option value="auto">Automatic</option>${sc.protocols.map(p => `<option value="${p.id}" ${e.protocol === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>`;
function readScaleForm() {
  const e = scaleEdit;
  const v = (id) => { const el = $(id); return el ? el.value : undefined; };
  if ($('#scPort')) e.port = v('#scPort');
  if ($('#scUnit')) e.unit = v('#scUnit');
  if ($('#scAsk')) e.ask = $('#scAsk').checked;
  if ($('#scBaud')) e.baud = Number(v('#scBaud'));
  if ($('#scFraming')) { const f = v('#scFraming'); e.mask7 = f === '7E1'; e.framing = f === '7E1' ? '8N1' : f; }
  if ($('#scProto')) e.protocol = v('#scProto');
  if ($('#scHost')) e.host = v('#scHost');
  if ($('#scTcp')) e.tcpPort = Number(v('#scTcp'));
  if ($('#scAdv')) e.manual = $('#scAdv').open;
}
function bindScale(s) {
  const sc = s.scale;
  if (!sc) return;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('#scSetup', async () => { scaleEdit = { ...sc.cfg, source: sc.cfg.source || 'serial', protocol: sc.cfg.protocol || 'auto', baud: sc.cfg.baud || 9600, framing: sc.cfg.framing || '8N1' }; await window.agent.scalePorts(); render(true); });
  on('#scEdit', async () => { scaleEdit = { ...sc.cfg }; await window.agent.scalePorts(); render(true); });
  on('#scTest', async () => { $('#scTest').disabled = true; $('#scTest').textContent = 'Reading…'; await window.agent.scaleTest(); render(true); });
  if (!scaleEdit) return;
  document.querySelectorAll('input[name="scsrc"]').forEach(i => i.addEventListener('change', (ev) => { readScaleForm(); scaleEdit.source = ev.target.value; render(true); }));
  on('#scRefresh', async () => { readScaleForm(); await window.agent.scalePorts(); render(true); });
  on('#scCancel', () => { scaleEdit = null; render(true); });
  on('#scDetect', async () => {
    readScaleForm();
    if (!scaleEdit.port) { $('#scErr').textContent = 'Choose the COM port first.'; return; }
    await window.agent.scaleDetect(scaleEdit.port, !!scaleEdit.ask, scaleEdit.unit || 'kg');
    const st = await window.agent.state();
    if (st.scale.detect.result && st.scale.detect.result.ok) scaleEdit = null;
    render(true);
  });
  on('#scSave', async () => {
    readScaleForm();
    const r = await window.agent.scaleSave({ ...scaleEdit, enabled: true });
    if (!r.ok) { $('#scErr').textContent = r.error || 'Could not save.'; return; }
    scaleEdit = null; render(true);
  });
  on('#scOff', async () => { if (confirm('Turn the weighing scale off?')) { await window.agent.scaleSave({ ...sc.cfg, enabled: false }); scaleEdit = null; render(true); } });
}

async function render(force) {
  const s = await window.agent.state();
  // the live weight changes many times a second: it is updated in place, the rest only when something else changed
  const snap = JSON.stringify({ ...s, log: null, scale: s.scale ? { ...s.scale, live: s.scale.live ? s.scale.live.kind : null } : null });
  if (!force && snap === last) { updateLive(s); return; }
  const typing = document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName) && $('#app').contains(document.activeElement);
  if (!force && typing) { updateLive(s); return; }
  last = snap;
  $('#ver').textContent = 'Version ' + s.version;

  // ---- not paired: the printer list is shown ONLY here ----
  if (!s.paired) {
    if (pick && !s.choices.some(c => c.name === pick)) pick = '';
    $('#app').innerHTML = `<div class="card"><span class="title">1 · Printer</span>
      ${s.choices.length ? s.choices.map(c => `<label class="pick"><input type="radio" name="prn" value="${esc(c.name)}" ${c.name === pick ? 'checked' : ''}> ${esc(c.name)}</label>`).join('') : `<p class="err">No printer found on this PC.</p>`}</div>
      <div class="card"><span class="title">2 · Pair</span>
      <label for="code">Pairing code</label><input id="code" autocomplete="off" autocapitalize="characters" placeholder="From the website: Settings → Printing">
      <label for="label">PC name</label><input id="label" value="${esc(s.host)}">
      <div class="btns"><button id="pairBtn">Pair</button></div><div id="perr" class="err"></div></div>`;
    document.querySelectorAll('input[name="prn"]').forEach(i => i.addEventListener('change', e => { pick = e.target.value; }));
    $('#pairBtn').onclick = async () => {
      if (!pick) { $('#perr').textContent = 'Choose the printer first.'; return; }
      $('#pairBtn').disabled = true; $('#perr').textContent = '';
      const r = await window.agent.pair($('#code').value, $('#label').value, pick);
      if (!r.ok) { $('#perr').textContent = r.error; $('#pairBtn').disabled = false; } else { pick = ''; render(true); }
    };
    return;
  }

  // ---- paired: only THE printer of this PC, no list ----
  let printerCard;
  if (s.approval === 'pending') {
    printerCard = `<div class="card warn"><span class="title">Waiting for approval</span>
      <p class="muted">Approve this PC on the website (Settings → Printing).</p></div>`;
  } else {
    const problem = s.printerMissing ? `“${esc(s.printer)}” is not installed on this PC any more. Unpair and pair again to choose the printer.`
      : s.printerVirtual ? `“${esc(s.printer)}” is not a real printer. Unpair and pair again to choose the printer.`
      : !s.printer ? 'No printer set. Unpair and pair again to choose the printer.' : '';
    printerCard = `<div class="card ${problem ? 'warn' : ''}"><div class="row"><span class="title">Printer</span>${problem ? '<span class="badge bad">Problem</span>' : '<span class="badge ok">Ready</span>'}</div>
      ${s.printer ? `<div class="printer">${esc(s.printer)}</div>` : ''}
      ${problem ? `<p class="err">${problem}</p>` : `<div class="btns"><button class="ghost" id="smp">Test print</button><button class="ghost" id="cal">Calibration sheet</button></div><div id="tmsg" class="muted"></div>`}</div>`;
  }
  $('#app').innerHTML = `
    <div class="card"><div class="row"><span class="title">${esc(s.label)}</span><span class="badge ${s.connected ? 'ok' : 'bad'}">${s.connected ? 'Online' : 'Offline'}</span></div>
      ${s.lastError ? `<p class="err">${esc(s.lastError)}</p>` : ''}
      ${s.lastJob ? `<p class="muted">Last slip: ${esc(s.lastJob)}</p>` : ''}</div>
    ${printerCard}
    ${scaleCard(s)}
    <div class="card"><div class="row"><span class="title">Backup</span><span class="muted" style="margin:0">${s.backup.days} day(s)</span></div>
      <p class="muted">${esc(s.backup.root)}</p>
      <div class="btns"><button class="ghost" id="bopen">Open folder</button><button class="ghost" id="bchoose">Change folder</button></div></div>
    <div class="card"><div class="btns" style="margin:0"><button class="danger" id="unpair">Unpair</button><button class="ghost" id="logopen">Log file</button></div></div>`;
  bindScale(s);
  const t = (kind) => async () => { $('#tmsg').textContent = 'Sending…'; const r = await window.agent.testPrint(s.printer, kind); $('#tmsg').textContent = r.ok ? 'Sent to the printer.' : 'Failed: ' + r.error; };
  if ($('#smp')) { $('#smp').onclick = t('sample'); $('#cal').onclick = t('calibration'); }
  $('#bopen').onclick = () => window.agent.backupOpen();
  $('#logopen').onclick = () => window.agent.logOpen();
  $('#bchoose').onclick = async () => { const r = await window.agent.backupChoose(); if (r.ok) render(true); };
  $('#unpair').onclick = async () => { if (confirm('Unpair this PC? It stops printing until it is paired again.')) { await window.agent.unpair(); render(true); } };
}
$('#site').onclick = (e) => { e.preventDefault(); window.agent.websiteOpen(); };
window.agent.onState(() => render(false));
render(true);
</script>
</body>
</html>
